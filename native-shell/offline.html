<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>No connection</title>
  <!--
    Shown by Capacitor (server.errorPath in capacitor.config.json) when the
    native app can't load the live site — no signal, airplane mode, or the
    server is down. Lives in the app bundle itself, so it works offline.
    Without it the app just shows a blank screen, which App Review treats
    as a broken app.
  -->
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #05010f; color: #f4ecff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center;
      padding: max(32px, env(safe-area-inset-top)) 28px max(32px, env(safe-area-inset-bottom)); }
    .eye { width: 72px; height: 72px; margin-bottom: 28px; }
    h1 { font-size: 22px; margin: 0 0 10px; letter-spacing: 0.02em; }
    p { margin: 0 0 28px; color: #b9a6d9; line-height: 1.5; max-width: 300px; }
    button { appearance: none; border: 0; border-radius: 999px; padding: 14px 32px;
      font-size: 16px; font-weight: 700; color: #05010f; background: #ff2d95; }
    button:active { transform: scale(0.97); }
    .status { margin-top: 18px; font-size: 13px; color: #6b4f99; min-height: 1em; }
  </style>
</head>
<body>
  <main>
    <svg class="eye" viewBox="0 0 72 72" aria-hidden="true">
      <path d="M6 36 C18 16, 54 16, 66 36 C54 56, 18 56, 6 36 Z" fill="none" stroke="#ff2d95" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="36" cy="36" r="10" fill="#ff2d95"/>
      <line x1="10" y1="62" x2="62" y2="10" stroke="#05010f" stroke-width="8"/>
      <line x1="10" y1="62" x2="62" y2="10" stroke="#6b4f99" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <h1>Can&rsquo;t connect</h1>
    <p>You're offline or the connection dropped. Check your signal and try again — your game is waiting where you left it.</p>
    <button id="retry" type="button">Try again</button>
    <div class="status" id="status"></div>
  </main>
  <script>
    // Same URL as server.url in capacitor.config.json.
    var APP_URL = "https://project-b-pink.vercel.app";
    var statusEl = document.getElementById("status");
    function retry() {
      statusEl.textContent = "Reconnecting…";
      window.location.href = APP_URL;
    }
    document.getElementById("retry").addEventListener("click", retry);
    // Come back automatically as soon as the device reports a connection.
    window.addEventListener("online", retry);
  </script>
</body>
</html>
